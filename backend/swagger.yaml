  # ══════════════════════════════════════════════════════
  /whatsapp/send:
    post:
      tags: [WhatsApp]
      summary: Send WhatsApp message (queued)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsAppSendDto'
      responses:
        '201':
          description: Message queued
          content:
            application/json:
              schema:
                type: object

  /whatsapp/recipients/class/{classId}:
    get:
      tags: [WhatsApp]
      summary: Get WhatsApp recipients for class
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Recipients list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    phoneNumber:
                      type: string
                    studentName:
                      type: string
                    parentName:
                      type: string

  /whatsapp/recipients/student/{studentId}:
    get:
      tags: [WhatsApp]
      summary: Get WhatsApp recipient for student
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Recipient data
          content:
            application/json:
              schema:
                type: object

  /whatsapp/history:
    get:
      tags: [WhatsApp]
      summary: Get WhatsApp message history
      parameters:
        - name: schoolId
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Message history
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
