openapi: 3.0.3
info:
  title: Nuvana Production API
  description: |
    Complete API documentation for the Nuvana Education Platform backend.

    **Authentication**: All endpoints (except those marked Public) require a Bearer JWT token in the `Authorization` header.
    The `x-school-id` header is required for tenant isolation on most endpoints.

    **Roles**: super_admin, school_admin, teacher, student

    **Rate Limiting**: Global 100 req/min. AI endpoints: 5 req/min.
  version: 1.0.0
  contact:
    name: Nuvana Team

servers:
  - url: https://api.nuvanacore.com
    description: Production
  - url: http://localhost:3000
    description: Local development
    description: Production

tags:
  - name: Health
    description: Health check endpoints (Public)
  - name: Auth
    description: Authentication & session management
  - name: Users
    description: User profile management
  - name: Schools
    description: School CRUD (super_admin only)
  - name: Academic
    description: Grades, classes, subjects, timetable, exams
  - name: Attendance
    description: Student attendance tracking
  - name: Tests
    description: Test creation, submission, and grading
  - name: Analytics
    description: Student & class analytics
  - name: Engagement
    description: Live engagement sessions & leaderboards
  - name: Announcements
    description: Teacher announcements to classes
  - name: Notifications
    description: In-app notification system
  - name: Messages
    description: Direct messaging between users
  - name: FileUpload
    description: Voice notes, PDFs, and video uploads
  - name: PdfAnnotations
    description: PDF annotation storage
  - name: AI
    description: AI-powered tutoring & teacher tools
  - name: RAG
    description: Retrieval-Augmented Generation material lookup
  - name: WhatsApp
    description: WhatsApp messaging integration

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    SchoolId:
      name: x-school-id
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Tenant school ID extracted from JWT

  schemas:
    # ─── Auth ───────────────────────────────────────────
    RegisterSuperAdminDto:
      type: object
      required: [email, password, name, secret]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        name:
          type: string
        secret:
          type: string

    RegisterUserDto:
      type: object
      required: [email, name, role_id, temporaryPassword]
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        role_id:
          type: integer
          description: "1=super_admin, 2=school_admin, 3=teacher, 4=student"
        school_id:
          type: string
          format: uuid
        temporaryPassword:
          type: string
          minLength: 8

    LoginDto:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        school_id:
          type: string
          format: uuid
        expectedRole:
          type: string

    ResetPasswordDto:
      type: object
      required: [userId, newPassword]
      properties:
        userId:
          type: string
          format: uuid
        newPassword:
          type: string
          minLength: 8

    AuthTokenResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
            name:
              type: string
            role:
              type: string
            school_id:
              type: string
              format: uuid

    # ─── Users ──────────────────────────────────────────
    UpdateProfileDto:
      type: object
      properties:
        name:
          type: string
        avatar_url:
          type: string

    CreateStudentDetailsDto:
      type: object
      properties:
        roll_number:
          type: string
        admission_date:
          type: string
          format: date-time
        parent_contact:
          type: string
        class_id:
          type: string
          format: uuid

    CreateTeacherDetailsDto:
      type: object
      properties:
        bio:
          type: string
        specialization:
          type: string
        joining_date:
          type: string
          format: date-time

    # ─── Schools ────────────────────────────────────────
    CreateSchoolDto:
      type: object
      required: [name]
      properties:
        name:
          type: string
        admin_profile_id:
          type: string
          format: uuid

    UpdateSchoolDto:
      type: object
      properties:
        name:
          type: string
        admin_profile_id:
          type: string
          format: uuid

    OnboardSchoolDto:
      type: object
      required: [name, admin_email, admin_password, admin_name]
      properties:
        name:
          type: string
        admin_email:
          type: string
          format: email
        admin_password:
          type: string
        admin_name:
          type: string

    # ─── Academic ───────────────────────────────────────
    CreateGradeDto:
      type: object
      required: [name]
      properties:
        name:
          type: string

    UpdateGradeDto:
      type: object
      properties:
        name:
          type: string

    CreateClassDto:
      type: object
      required: [name, grade_level_id]
      properties:
        name:
          type: string
        grade_level_id:
          type: integer

    UpdateClassDto:
      type: object
      properties:
        name:
          type: string
        grade_level_id:
          type: integer

    CreateSubjectDto:
      type: object
      required: [name]
      properties:
        name:
          type: string

    AssignSubjectsToGradeDto:
      type: object
      required: [grade_level_id, subject_master_ids]
      properties:
        grade_level_id:
          type: integer
        subject_master_ids:
          type: array
          items:
            type: string
            format: uuid

    AssignTeacherToClassDto:
      type: object
      required: [teacher_id, class_id]
      properties:
        teacher_id:
          type: string
          format: uuid
        class_id:
          type: string
          format: uuid

    AssignSubjectsToTeacherDto:
      type: object
      required: [teacher_id, grade_subject_ids]
      properties:
        teacher_id:
          type: string
          format: uuid
        grade_subject_ids:
          type: array
          items:
            type: string
            format: uuid

    CreateFileCategoryDto:
      type: object
      required: [name]
      properties:
        name:
          type: string

    UpdateFileCategoryDto:
      type: object
      properties:
        name:
          type: string

    CreateExamTypeDto:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: string
          description: "'Internal Assessment' or 'School Exam'"

    UpdateExamTypeDto:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum: [Internal_Assessment, School_Exam]

    CreatePeriodDto:
      type: object
      required: [class_id, day_of_week, period_number, subject_id, teacher_id, start_time, end_time]
      properties:
        class_id:
          type: string
          format: uuid
        day_of_week:
          type: integer
          minimum: 1
          maximum: 7
          description: "1=Monday, 7=Sunday"
        period_number:
          type: integer
          minimum: 1
        subject_id:
          type: string
          format: uuid
          description: grade_subjects.id
        teacher_id:
          type: string
          format: uuid
        start_time:
          type: string
          description: "HH:MM format"
        end_time:
          type: string
          description: "HH:MM format"
        room:
          type: string

    UpdatePeriodDto:
      type: object
      properties:
        period_number:
          type: integer
          minimum: 1
        subject_id:
          type: string
          format: uuid
        teacher_id:
          type: string
          format: uuid
        start_time:
          type: string
        end_time:
          type: string
        room:
          type: string

    SaveManualMarksDto:
      type: object
      required: [title, class_id, grade_subject_id, exam_type_id, max_marks, marks]
      properties:
        title:
          type: string
        class_id:
          type: string
        grade_subject_id:
          type: string
        exam_type_id:
          type: integer
        max_marks:
          type: number
        marks:
          type: array
          items:
            type: object
            required: [student_id, marks_obtained]
            properties:
              student_id:
                type: string
              marks_obtained:
                type: number
        description:
          type: string

    # ─── Attendance ─────────────────────────────────────
    MarkAttendanceDto:
      type: object
      required: [classId, attendanceDate, students, teacherId]
      properties:
        classId:
          type: string
          format: uuid
        attendanceDate:
          type: string
          format: date
        students:
          type: array
          items:
            type: object
            required: [id, name, roll_number]
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              roll_number:
                type: string
              present:
                type: boolean
              status:
                type: string
        teacherId:
          type: string
          format: uuid
        periodId:
          type: string
          format: uuid

    BulkMarkAttendanceDto:
      type: object
      required: [classId, attendanceDates, students, teacherId]
      properties:
        classId:
          type: string
          format: uuid
        attendanceDates:
          type: array
          items:
            type: string
            format: date
        students:
          type: array
          items:
            $ref: '#/components/schemas/MarkAttendanceDto/properties/students/items'
        teacherId:
          type: string
          format: uuid

    # ─── Tests ──────────────────────────────────────────
    CreateTestDto:
      type: object
      required: [title, duration_minutes, is_published, class_id, grade_subject_id, exam_type_id, teacher_id, questions]
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
        duration_minutes:
          type: integer
          minimum: 1
        is_published:
          type: boolean
        class_id:
          type: string
          format: uuid
        grade_subject_id:
          type: string
          format: uuid
        exam_type_id:
          type: integer
        teacher_id:
          type: string
          format: uuid
        due_date:
          type: string
          format: date-time
        questions:
          type: array
          items:
            $ref: '#/components/schemas/CreateQuestionDto'

    CreateQuestionDto:
      type: object
      required: [question_text, marks, question_type]
      properties:
        id:
          type: string
          format: uuid
        question_text:
          type: string
          maxLength: 5000
        marks:
          type: integer
          minimum: 1
        chapter:
          type: string
        topic:
          type: string
        question_type:
          type: string
          enum: [MCQ, Essay, Short Answer, Very Short Answer]
        correct_option_index:
          type: integer
        expected_answer_text:
          type: string
        options:
          type: array
          items:
            type: string

    UpdateTestDto:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        duration_minutes:
          type: integer
        is_published:
          type: boolean
        class_id:
          type: string
          format: uuid
        grade_subject_id:
          type: string
          format: uuid
        exam_type_id:
          type: integer
        due_date:
          type: string
          format: date-time
        questions:
          type: array
          items:
            $ref: '#/components/schemas/CreateQuestionDto'

    SubmitTestDto:
      type: object
      required: [test_id, student_id, answers]
      properties:
        test_id:
          type: string
          format: uuid
        student_id:
          type: string
          format: uuid
        answers:
          type: array
          items:
            type: object
            required: [question_id]
            properties:
              question_id:
                type: string
                format: uuid
              student_selected_option_index:
                type: integer
                minimum: 0
              subjective_answer_text:
                type: string

    GradeSubmissionDto:
      type: object
      required: [submission_id, answers]
      properties:
        submission_id:
          type: string
          format: uuid
        answers:
          type: array
          items:
            type: object
            required: [answer_id, marks_awarded]
            properties:
              answer_id:
                type: string
                format: uuid
              marks_awarded:
                type: integer
                minimum: 0
        total_marks_obtained:
          type: integer
          minimum: 0

    CreateTestFromAiGradingDto:
      type: object
      required: [student_id, test_name, subject, class_id, total_marks, marks_obtained, ai_feedback, teacher_id, school_id]
      properties:
        student_id:
          type: string
          format: uuid
        test_name:
          type: string
        subject:
          type: string
        class_id:
          type: string
          format: uuid
        total_marks:
          type: number
          minimum: 1
        marks_obtained:
          type: number
          minimum: 0
        ai_feedback:
          type: string
        test_date:
          type: string
          description: ISO date string, defaults to today
        teacher_id:
          type: string
          format: uuid
        school_id:
          type: string
          format: uuid
        exam_type_id:
          type: number

    # ─── Engagement ─────────────────────────────────────
    CreateSessionDto:
      type: object
      required: [school_id, teacher_id, class_id]
      properties:
        school_id:
          type: string
          format: uuid
        teacher_id:
          type: string
          format: uuid
        class_id:
          type: string
          format: uuid
        file_id:
          type: string
          format: uuid
        session_name:
          type: string

    SendQuestionDto:
      type: object
      required: [question_text, option_a, option_b, option_c, option_d, correct_option, time_limit_seconds, points]
      properties:
        question_text:
          type: string
        option_a:
          type: string
        option_b:
          type: string
        option_c:
          type: string
        option_d:
          type: string
        correct_option:
          type: string
          enum: [A, B, C, D]
        time_limit_seconds:
          type: integer
          minimum: 10
          maximum: 120
        points:
          type: integer
          minimum: 5
          maximum: 50

    # ─── Announcements ──────────────────────────────────
    CreateAnnouncementDto:
      type: object
      required: [title, message, classIds, teacherId]
      properties:
        title:
          type: string
        message:
          type: string
        isUrgent:
          type: boolean
        classIds:
          type: array
          items:
            type: string
            format: uuid
        teacherId:
          type: string
          format: uuid

    UpdateAnnouncementDto:
      type: object
      properties:
        title:
          type: string
        message:
          type: string
        isUrgent:
          type: boolean

    # ─── Notifications ──────────────────────────────────
    CreateNotificationDto:
      type: object
      required: [recipient_id, title, message]
      properties:
        recipient_id:
          type: string
          format: uuid
        title:
          type: string
        message:
          type: string
        notification_type:
          type: string
        source_id:
          type: string
          format: uuid
        target_url:
          type: string
        is_urgent:
          type: boolean

    CreateBatchNotificationDto:
      type: object
      required: [recipient_ids, title, message]
      properties:
        recipient_ids:
          type: array
          items:
            type: string
            format: uuid
        title:
          type: string
        message:
          type: string
        notification_type:
          type: string
        source_id:
          type: string
          format: uuid
        target_url:
          type: string
        is_urgent:
          type: boolean

    # ─── Messages ───────────────────────────────────────
    SendMessageDto:
      type: object
      required: [recipientId, subject, message]
      properties:
        recipientId:
          type: string
          format: uuid
        subject:
          type: string
        message:
          type: string
        isUrgent:
          type: boolean

    # ─── File Upload ────────────────────────────────────
    UploadVoiceNoteDto:
      type: object
      required: [title, classId, gradeSubjectId, durationSeconds]
      properties:
        title:
          type: string
        classId:
          type: string
        gradeSubjectId:
          type: string
        durationSeconds:
          type: string
          description: Duration in seconds (sent as string in FormData)

    UploadFileDto:
      type: object
      required: [title, gradeSubjectId, fileType, teacherId, schoolId]
      properties:
        title:
          type: string
        classId:
          type: string
        gradeSubjectId:
          type: string
        categoryId:
          type: string
        fileType:
          type: string
          enum: [pdf, video]
        teacherId:
          type: string
        schoolId:
          type: string

    # ─── PDF Annotations ────────────────────────────────
    SaveAnnotationDto:
      type: object
      required: [file_id, page_number, annotation_data, note_type]
      properties:
        file_id:
          type: string
        page_number:
          type: integer
        annotation_data:
          type: object
          description: Freeform annotation JSON
        note_type:
          type: string

    # ─── AI ─────────────────────────────────────────────
    AiRequestDto:
      type: object
      required: [query]
      properties:
        query:
          type: string
        classId:
          type: string
        subject:
          type: string
        topic:
          type: string
        studentId:
          type: string
        additionalContext:
          type: object
        quizParams:
          type: object
          properties:
            questionCount:
              type: integer
            difficulty:
              type: string
              enum: [Easy, Medium, Hard]
            questionTypes:
              type: object
              properties:
                mcq:
                  type: integer
                shortAnswer:
                  type: integer
                essay:
                  type: integer
            bloomLevels:
              type: array
              items:
                type: string
        studyPlanParams:
          type: object
          properties:
            days:
              type: integer
            hoursPerDay:
              type: integer

    AiResponseDto:
      type: object
      properties:
        title:
          type: string
        keyPoints:
          type: array
          items:
            type: string
        explanation:
          type: string
        personalizedFeedback:
          type: string
        followUpQuestion:
          type: string
        rawResponse:
          type: string
        metadata:
          type: object
        quickReplies:
          type: array
          items:
            type: object
            properties:
              text:
                type: string
              value: {}
              payload: {}
              icon:
                type: string
              recommended:
                type: boolean
        waitingForInput:
          type: boolean
        inputType:
          type: string
          enum: [questionCount, questionType, difficulty, studyPlanDays, studyPlanHours]

    # ─── WhatsApp ───────────────────────────────────────
    WhatsAppSendDto:
      type: object
      required: [useCase, data, senderId, schoolId]
      properties:
        useCase:
          type: string
          enum: [school_announcement]
        data:
          type: object
          description: Template-specific data
          properties:
            parentName:
              type: string
            studentName:
              type: string
            messageText:
              type: string
            schoolName:
              type: string
        phoneNumber:
          type: string
        recipients:
          type: array
          items:
            type: object
            properties:
              phoneNumber:
                type: string
              recipientId:
                type: string
        senderId:
          type: string
        schoolId:
          type: string

    # ─── Common ─────────────────────────────────────────
    SuccessMessage:
      type: object
      properties:
        message:
          type: string

security:
  - BearerAuth: []

paths:
  # ══════════════════════════════════════════════════════
  #  HEALTH
  # ══════════════════════════════════════════════════════
  /health:
    get:
      tags: [Health]
      summary: Health check
      security: []
      responses:
        '200':
          description: Service health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok, degraded]
                  timestamp:
                    type: string
                    format: date-time
                  services:
                    type: object
                    properties:
                      database:
                        type: string
                      rag:
                        type: string
                      api:
                        type: string

  /health/ping:
    get:
      tags: [Health]
      summary: Ping
      security: []
      responses:
        '200':
          description: Pong
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: pong
                  timestamp:
                    type: string
                    format: date-time

  # ══════════════════════════════════════════════════════
  #  AUTH
  # ══════════════════════════════════════════════════════
  /auth/super-admin/register:
    post:
      tags: [Auth]
      summary: Register super admin (Public)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterSuperAdminDto'
      responses:
        '201':
          description: Super admin registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'

  /auth/register:
    post:
      tags: [Auth]
      summary: Register user (super_admin, school_admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUserDto'
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  email:
                    type: string
                  name:
                    type: string

  /auth/login:
    post:
      tags: [Auth]
      summary: Login (Public)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password (Public)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordDto'
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token (Public)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: New tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'

  /auth/validate-session:
    post:
      tags: [Auth]
      summary: Validate current session
      responses:
        '200':
          description: Session valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean

  /auth/session:
    post:
      tags: [Auth]
      summary: Get current user session info
      responses:
        '200':
          description: Current user data
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  email:
                    type: string
                  name:
                    type: string
                  role:
                    type: string
                  school_id:
                    type: string

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout (blacklists token)
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'

  # ══════════════════════════════════════════════════════
  #  USERS
  # ══════════════════════════════════════════════════════
  /users:
    get:
      tags: [Users]
      summary: Get all users for school
      parameters:
        - $ref: '#/components/parameters/SchoolId'
